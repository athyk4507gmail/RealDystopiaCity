<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200, height=630">
  <title>CityPulse AI - OG Image Template</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 1200px;
      height: 630px;
      background: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Grid pattern */
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 0;
    }

    /* Border */
    body::after {
      content: '';
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      bottom: 20px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      pointer-events: none;
      z-index: 10;
    }

    .container {
      position: relative;
      z-index: 1;
      padding: 80px;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .main-content {
      flex: 1;
    }

    .logo {
      font-size: 100px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
      margin-bottom: 40px;
    }

    .tagline {
      font-size: 42px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.6);
      line-height: 1.3;
      margin-bottom: 80px;
    }

    .stats {
      display: flex;
      gap: 100px;
      margin-bottom: 40px;
    }

    .stat {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .stat-value {
      font-size: 56px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .stat-label {
      font-size: 24px;
      color: rgba(255, 255, 255, 0.4);
      font-weight: 400;
    }

    .badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.05);
      padding: 14px 20px;
      font-size: 20px;
      color: rgba(255, 255, 255, 0.6);
      border-radius: 4px;
    }

    .bg-text {
      position: absolute;
      bottom: 40px;
      right: 60px;
      font-size: 180px;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.04);
      letter-spacing: -0.05em;
      z-index: 0;
    }
  </style>
</head>
<body>
  <div class="bg-text">AI</div>
  
  <div class="container">
    <div class="main-content">
      <div class="logo">CityPulse AI</div>
      
      <div class="tagline">
        Unified Intelligence for<br>
        Sustainable Cities
      </div>
      
      <div class="stats">
        <div class="stat">
          <div class="stat-value">6</div>
          <div class="stat-label">City Modules</div>
        </div>
        <div class="stat">
          <div class="stat-value">12B</div>
          <div class="stat-label">Parameters</div>
        </div>
        <div class="stat">
          <div class="stat-value">3</div>
          <div class="stat-label">AI Modes</div>
        </div>
      </div>
    </div>

    <div class="badge">Powered by Google Gemma 4</div>
  </div>
</body>
</html>
